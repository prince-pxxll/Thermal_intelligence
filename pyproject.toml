[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-intelligence"
version = "0.1.0"
description = "Satellite-derived thermal anomaly intelligence for Maharashtra"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Thermal Intelligence Maharashtra Contributors" }
]
keywords = [
    "remote-sensing",
    "thermal-anomaly-detection",
    "FIRMS",
    "geospatial",
    "risk-scoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.urls]
Repository = "https://github.com/<org>/thermal-intelligence-maharashtra"
Issues = "https://github.com/<org>/thermal-intelligence-maharashtra/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=thermal_intelligence --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/thermal_intelligence"]
omit = ["*/__init__.py"]
