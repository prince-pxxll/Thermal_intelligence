# Canonical schema for the source-level model-ready feature table.
#
# The analytical unit is one candidate thermal source/event.
# Feature vector:
# X = [T, tau, S, G]
#
# Required features must be available from FIRMS + source formation.
# Context features may degrade gracefully when external geospatial data
# are unavailable.

schema_version: 2

identifier:
  - name: event_id
    dtype: string
    description: Stable ID for a clustered candidate thermal source.
    required: true

thermal_features:
  source_module: thermal_intelligence.features.thermal
  fields:
    - {name: mean_frp, dtype: float, required: true}
    - {name: median_frp, dtype: float, required: true}
    - {name: max_frp, dtype: float, required: true}
    - {name: frp_std, dtype: float, required: false}
    - {name: mean_brightness_ti4, dtype: float, required: true}
    - {name: max_brightness_ti4, dtype: float, required: true}
    - {name: mean_brightness_ti5, dtype: float, required: false}
    - {name: confidence_high_ratio, dtype: float, range: [0, 1], required: true}

temporal_features:
  source_module: thermal_intelligence.features.temporal
  fields:
    - {name: first_seen, dtype: datetime, required: true}
    - {name: last_seen, dtype: datetime, required: true}
    - {name: active_days, dtype: int, required: true}
    - {name: temporal_span_days, dtype: float, range: [0, null], required: true}
    - {name: detection_frequency_per_day, dtype: float, range: [0, null], required: true}
    - {name: night_activity_ratio, dtype: float, range: [0, 1], required: true}
    - {name: day_activity_ratio, dtype: float, range: [0, 1], required: true}

spatial_features:
  source_module: thermal_intelligence.geospatial.spatial_features
  fields:
    - {name: centroid_lat, dtype: float, range: [-90, 90], required: true}
    - {name: centroid_lon, dtype: float, range: [-180, 180], required: true}
    - {name: cluster_radius_km, dtype: float, range: [0, null], required: true}
    - {name: spatial_std_km, dtype: float, range: [0, null], required: false}
    - {name: spatial_observations, dtype: int, range: [1, null], required: true}
    - {name: spatial_variation_observable, dtype: bool, required: true}

context_features:
  source_module: thermal_intelligence.features.context
  fields:
    - {name: dist_to_industrial_m, dtype: float, range: [0, null], required: false}
    - {name: dist_to_cropland_m, dtype: float, range: [0, null], required: false}
    - {name: dist_to_forest_m, dtype: float, range: [0, null], required: false}
    - {name: dist_to_road_m, dtype: float, range: [0, null], required: false}
    - {name: landuse_category, dtype: category, required: false}
    - {name: district, dtype: category, required: true}

model_outputs:
  fields:
    - {name: predicted_event_type, dtype: category, values: [agricultural, industrial, wildfire, other], required: false}
    - {name: classification_confidence, dtype: float, range: [0, 1], required: false}
    - {name: anomaly_score, dtype: float, required: false}
    - {name: risk_score, dtype: float, range: [0, 100], required: false}
    - {name: risk_explanation, dtype: string, required: false}